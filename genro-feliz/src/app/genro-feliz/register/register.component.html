<form [formGroup]="registerForm" class="form-container">
  <h2>Informações Pessoais</h2>
  <div class="form-row">
    <div class="form-column">
      <div class="form-group">
        <label for="firstName">Primeiro Nome</label>
        <input type="text" id="firstName" class="form-control" formControlName="firstName" />
      </div>

      <div class="form-group">
        <label for="lastName">Sobrenome</label>
        <input type="text" id="lastName" class="form-control" formControlName="lastName" />
      </div>
    </div>

    <div class="form-column">
      <div class="form-group">
        <label for="cpf">CPF</label>
        <p-inputMask
          mask="999.999.999-99"
          placeholder="000.000.000-00"
          id="cpf"
          formControlName="cpf"
          class="form-control"
        ></p-inputMask>
      </div>

      <div class="form-group">
        <label for="dataNascimento">Data de Nascimento</label>
        <p-calendar
          placeholder="dd/MM/yyyy"
          formControlName="dataNascimento"
          inputId="dataNascimento"
          class="calendar-input"
        ></p-calendar>
      </div>
    </div>
  </div>

  <h2>Informações de Login</h2>

  <div class="form-group">
    <label for="login">Login (Email)</label>
    <input
      type="text"
      id="login"
      placeholder="user@gmail.com"
      class="form-control"
      formControlName="login"
    />
  </div>

  <div class="form-group">
    <label for="password">Senha</label>
    <div class="password-group">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        class="form-control"
        formControlName="password"
      />
      <button type="button" (click)="togglePasswordVisibility()" class="toggle-btn">
        <i class="pi" [ngClass]="showPassword ? 'pi-eye' : 'pi-eye-slash'"></i>
      </button>
    </div>
  </div>

  <div class="form-group">
    <label for="passwordConfirm">Confirme a Senha</label>
    <div class="password-group">
      <input
        [type]="showPassword2 ? 'text' : 'password'"
        id="passwordConfirm"
        class="form-control"
        formControlName="passwordConfirm"
      />
      <button type="button" (click)="togglePasswordVisibility2()" class="toggle-btn">
        <i class="pi" [ngClass]="showPassword2 ? 'pi-eye' : 'pi-eye-slash'"></i>
      </button>
    </div>
  </div>

  <button
    type="submit"
    [disabled]="!registerForm.valid"
    class="btn-submit"
    (click)="registrarUsuario()"
  >
    <i class="pi pi-check"></i> Registrar
  </button>
</form>

<p-toast position="bottom-right"></p-toast>
